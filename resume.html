<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Zoé Poinssot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f8f4ef;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 2.5rem 1.5rem;
  }

  .page-header {
    max-width: 900px;
    width: 100%;
    margin: 0 auto 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .back-link {
    font-size: 0.78rem;
    color: #a09890;
    text-decoration: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }
  .back-link:hover { color: #3a3530; }

  .header-center { text-align: center; flex: 1; }

  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: #3a3530;
  }

  .page-sub {
    font-size: 0.7rem;
    color: #a09890;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 0.2rem;
  }


  /* PDF container */
  .pdf-wrap {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    background: #fff;
  }


  /* Footer */
  .page-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.66rem;
    color: #c0b8ae;
    letter-spacing: 1px;
  }
  .page-footer a {
    color: #a09890;
    text-decoration: none;
    border-bottom: 1px solid rgba(160,152,144,0.3);
    padding-bottom: 1px;
    transition: color 0.2s;
  }
  .page-footer a:hover { color: #3a3530; }
</style>
</head>
<body>

<div class="page-header">
  <a href="index.html" class="back-link">← Back</a>
  <div class="header-center">
    <p class="page-title">Zoé Poinssot</p>
    <p class="page-sub">Resume</p>
  </div>
  <div class="header-right"></div>
</div>

<!-- Boutons de langue -->
<div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 1.5rem;">
  <button onclick="showCV('en')" id="btn-en" style="font-family: 'DM Sans', sans-serif; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; padding: 0.45rem 1.1rem; border-radius: 20px; border: 1px solid rgba(200,188,175,0.6); background: #3a3530; color: #f8f4ef; cursor: pointer; transition: all 0.2s ease;">
    English
  </button>
  <button onclick="showCV('fr')" id="btn-fr" style="font-family: 'DM Sans', sans-serif; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; padding: 0.45rem 1.1rem; border-radius: 20px; border: 1px solid rgba(200,188,175,0.6); background: #fff; color: #3a3530; cursor: pointer; transition: all 0.2s ease;">
    Français
  </button>
</div>

<!-- Images CV -->
<div class="pdf-wrap">
  <img id="cv-en" src="cv-en.png" alt="Zoé Poinssot CV — English" style="width: 100%; display: block; border-radius: 12px;">
  <img id="cv-fr" src="cv-fr.png" alt="Zoé Poinssot CV — Français" style="width: 100%; display: none; border-radius: 12px;">
</div>

<script>
  function showCV(lang) {
    document.getElementById('cv-en').style.display = lang === 'en' ? 'block' : 'none';
    document.getElementById('cv-fr').style.display = lang === 'fr' ? 'block' : 'none';
    document.getElementById('btn-en').style.background = lang === 'en' ? '#3a3530' : '#fff';
    document.getElementById('btn-en').style.color = lang === 'en' ? '#f8f4ef' : '#3a3530';
    document.getElementById('btn-fr').style.background = lang === 'fr' ? '#3a3530' : '#fff';
    document.getElementById('btn-fr').style.color = lang === 'fr' ? '#f8f4ef' : '#3a3530';
  }
</script>

<div class="page-footer">
  <a href="index.html">← Back to main page</a> · Zoé Poinssot · 2026
</div>
